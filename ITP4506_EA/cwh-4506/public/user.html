      /* ======= Fly animation: shortened by 0.5s (was 2000ms -> now 1500ms) ======= */
      function animateAddMultipleToWishlist(imgEl, qty, onComplete){
        if(!imgEl){ onComplete(); return; }
        const rect = imgEl.getBoundingClientRect();
        const startX = rect.left + rect.width/2;
        const startY = rect.top + rect.height/2;
        const targetRect = floatingCartBtn.getBoundingClientRect();
        const endX = targetRect.left + targetRect.width/2;
        const endY = targetRect.top + targetRect.height/2;
        const total = Math.min(qty, 12);
        let completed = 0;
        const duration = 1500;
        for(let i=0;i<total;i++){
          const clone = imgEl.cloneNode(true);
          clone.style.width='36px';
          clone.style.height='36px';
          clone.style.borderRadius='50%';
          clone.style.position='fixed';
          clone.style.zIndex='9999';
          clone.style.pointerEvents='none';
          document.body.appendChild(clone);
          const jitterX=(Math.random()-0.5)*rect.width*0.3, jitterY=(Math.random()-0.5)*rect.height*0.3;
          const sx=startX+jitterX, sy=startY+jitterY;
          clone.style.left = sx+'px';
          clone.style.top = sy+'px';
          clone.style.transform='translate(-50%,-50%)';
          const delay=i*60;
          setTimeout(()=>{
            clone.style.transition=`transform ${duration}ms var(--anim-ease), opacity ${duration}ms linear`;
            const dx=endX - sx, dy=endY - sy;
            clone.style.transform = `translate(${dx}px, ${dy}px) scale(.15)`;
            clone.style.opacity='0';
            setTimeout(()=>{
              clone.remove();
              completed++;
              if(completed===total) onComplete();
            }, duration+60);
          }, delay);
        }
        if(qty > total){
          setTimeout(()=> onComplete(), duration + total*60 + 100);
        }
      }

      /* ======= Wishlist overlay flow, steps and dot animation sequence ======= */
      function createDotsBetween(container, count){
        container.innerHTML = '';
        for(let i=0;i<count;i++){
          const d = document.createElement('div');
          d.className='dot';
          d.dataset.index = i;
          const f = document.createElement('div');
          f.className='fill';
          d.appendChild(f);
          container.appendChild(d);
        }
      }
      createDotsBetween(dotsBetween1, 3);
      createDotsBetween(dotsBetween2, 3);
      createDotsBetween(dotsBetween3, 3);

      function setDotFill(container, index){
        const dots = Array.from(container.querySelectorAll('.dot'));
        dots.forEach((d,i)=> {
          const f = d.querySelector('.fill');
          if(i <= index) f.style.width = '100%';
          else f.style.width = '0';
        });
      }

      function animateDotsSequential(container, startIndex=0, delay=220){
        // ensure reset before sequence
        Array.from(container.querySelectorAll('.dot .fill')).forEach(f=> f.style.width='0');
        return new Promise((resolve)=>{
          const dots = Array.from(container.querySelectorAll('.dot'));
          let i = startIndex;
          function step(){
            if(i >= dots.length){ resolve(); return; }
            const f = dots[i].querySelector('.fill');
            f.style.width = '100%';
            i++;
            setTimeout(step, delay);
          }
          step();
        });
      }

      function animateBoxToGreen(stepSelector){
        const el = document.querySelector(`.step[data-step="${stepSelector}"]`);
        if(!el) return;
        el.style.transition = 'background 420ms ease, color 420ms ease';
        el.style.background = 'var(--accent)';
        el.style.color = '#fff';
      }

      function playSvgTick(container){
        const path = container.querySelector('.tick-path');
        if(!path) return;
        path.classList.remove('drawn');
        void path.offsetWidth;
        path.classList.add('drawn');
      }

      function transitionStep(fromStep, betweenContainer, toStep){
        // reset fills on betweenContainer before playing
        Array.from(betweenContainer.querySelectorAll('.dot .fill')).forEach(f=> f.style.width='0');
        return animateDotsSequential(betweenContainer, 0, 220).then(()=>{
          animateBoxToGreen(fromStep);
          setTimeout(()=> animateBoxToGreen(toStep), 240);
          const area = wishlistContentArea;
          const overlay = document.createElement('div');
          overlay.style.position = 'absolute';
          overlay.style.inset = '0';
          overlay.style.display = 'flex';
          overlay.style.flexDirection = 'column';
          overlay.style.alignItems = 'center';
          overlay.style.justifyContent = 'center';
          overlay.style.background = 'rgba(255,255,255,0.0)';
          overlay.style.zIndex = '40';
          const svgWrap = document.createElement('div');
          svgWrap.innerHTML = `<svg class="tick-svg" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg"><path class="tick-path" d="M14 27 L22 34 L38 16" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
          overlay.appendChild(svgWrap);
          area.appendChild(overlay);
          setTimeout(()=> playSvgTick(svgWrap), 80);
          setTimeout(()=> overlay.remove(), 900);
        });
      }

      function setActiveStepVisual(step){
        checkoutSteps.querySelectorAll('.step').forEach(s=> s.classList.toggle('active', s.dataset.step===step));
      }

      function renderWishlistStep(step){
        setActiveStepVisual(step);
        wishlistContentArea.innerHTML='';
        if(step==='items'){
          const rows=document.createElement('div');
          rows.className='wishlist-rows';
          WISHLIST.forEach(it=>{
            const p=findProductById(it.id);
            const row=document.createElement('div');
            row.className='wishlist-item';
            row.innerHTML = `
              <div style="display:flex;gap:8px;align-items:center">
                <img src="${p.imgs[0]}" alt="${it.title}">
                <div style="min-width:220px"><div style="font-weight:700">${it.title}</div><div class="small">Options: ${Object.keys(it.options).map(k=>k+': '+it.options[k]).join(' · ')}</div><div class="small">${formatPrice(it.price)} each</div></div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
                <div class="wishlist-controls">
                  <button class="minus" data-key="${it.key}">-</button>
                  <input class="input qty" data-key="${it.key}" style="width:56px;text-align:center" value="${it.qty}">
                  <button class="plus" data-key="${it.key}">+</button>
                  <button class="remove remove-green" data-key="${it.key}">Remove</button>
                </div>
                <div style="font-weight:900" data-subtotal-key="${it.key}">${formatPrice(it.subtotal)}</div>
              </div>`;
            row.addEventListener('click', (e)=>{ if(e.target.closest('.wishlist-controls') || e.target.closest('.remove')) return; openProductDetail(it.id); });
            const minusBtn = row.querySelector('.minus'), plusBtn = row.querySelector('.plus'), qtyInput = row.querySelector('.qty');
            attachHoldStages(plusBtn, +1, qtyInput);
            attachHoldStages(minusBtn, -1, qtyInput);
            minusBtn.addEventListener('click', (e)=>{ e.stopPropagation(); updateWishlistQty(it.key, -1, 'delta'); renderWishlistStep('items'); });
            plusBtn.addEventListener('click', (e)=>{ e.stopPropagation(); updateWishlistQty(it.key, +1, 'delta'); renderWishlistStep('items'); });
            qtyInput.addEventListener('input', (e)=>{ e.stopPropagation(); const v = Math.max(0, Number(e.target.value || 0)); updateWishlistQty(it.key, v, 'absolute'); renderWishlistStep('items'); });
            const removeBtn = row.querySelector('.remove');
            removeBtn.addEventListener('click', (e)=>{ e.stopPropagation(); removeFromWishlist(it.key); renderWishlistStep('items'); });
            rows.appendChild(row);
          });
          wishlistContentArea.appendChild(rows);
          const totals = calcTotals();
          const totalRow = document.createElement('div');
          totalRow.style.display='flex';
          totalRow.style.justifyContent='flex-end';
          totalRow.style.marginTop='8px';
          totalRow.innerHTML = `<div style="font-weight:900;margin-right:12px">Total: <span id="itemsTotal" class="confirm-total">${formatPrice(totals.total)}</span></div>`;
          wishlistContentArea.appendChild(totalRow);
          const actions=document.createElement('div');
          actions.style.display='flex';
          actions.style.justifyContent='space-between';
          actions.style.gap='8px';
          actions.style.marginTop='12px';
          const btnBack=document.createElement('button');
          btnBack.className='btn back-green';
          btnBack.textContent='Back to Items';
          btnBack.style.visibility='hidden';
          const btnNext=document.createElement('button');
          btnNext.className='btn proceed';
          btnNext.id='toDetails';
          btnNext.textContent='Proceed to Details';
          btnNext.addEventListener('click', ()=>{
            if(WISHLIST.length === 0){ showToast('Please add items before proceeding', 900); return; }
            transitionStep('items', dotsBetween1, 'details').then(()=>{ renderWishlistStep('details'); });
          });
          actions.appendChild(btnBack);
          actions.appendChild(btnNext);
          wishlistContentArea.appendChild(actions);
        } else if(step === 'details'){
          const grid=document.createElement('div');
          grid.className='details-grid';
          grid.innerHTML = `
            <div class="detail-box">
              <label>1: Full name (English only)</label>
              <input id="detailName" class="input" placeholder="John Doe">
              <div id="nameMsg" class="validation-msg">Use English letters only</div>
            </div>
            <div class="detail-box">
              <label>2: Phone (numbers only)</label>
              <input id="detailPhone" class="input" placeholder="85212345678">
              <div id="phoneMsg" class="validation-msg">Numbers only</div>
            </div>
            <div class="detail-box">
              <label>3: District / City</label>
              <input id="detailCity" class="input" placeholder="Type to search...">
              <div id="cityList" style="margin-top:6px;max-height:120px;overflow:auto"></div>
            </div>
            <div class="detail-box">
              <label>4: Building / Street</label>
              <input id="detailAddress" class="input" placeholder="123 Example St">
            </div>
          `;
          wishlistContentArea.appendChild(grid);
          if(TEMP_ORDER.details){
            const d = TEMP_ORDER.details;
            setTimeout(()=>{
              const nameEl = document.getElementById('detailName');
              const phoneEl = document.getElementById('detailPhone');
              const cityEl = document.getElementById('detailCity');
              const addrEl = document.getElementById('detailAddress');
              if(nameEl) nameEl.value = d.name || '';
              if(phoneEl) phoneEl.value = d.phone || '';
              if(cityEl) cityEl.value = d.city || '';
              if(addrEl) addrEl.value = d.address || '';
            }, 20);
          }
          const CITIES=['Central','Admiralty','Tsim Sha Tsui','Mong Kok','Causeway Bay','Wan Chai','Sha Tin','Tsuen Wan','Tuen Mun','Yuen Long','Kowloon Bay','Tai Po'];
          const cityList=document.getElementById('cityList');
          function updateCityList(filter=''){
            cityList.innerHTML='';
            CITIES.filter(c=> c.toLowerCase().startsWith(filter.toLowerCase())).forEach(c=>{
              const el=document.createElement('div');
              el.style.padding='6px';
              el.style.cursor='pointer';
              el.textContent=c;
              el.addEventListener('click', ()=>{ document.getElementById('detailCity').value=c; cityList.innerHTML=''; });
              cityList.appendChild(el);
            });
          }
          document.getElementById('detailCity').addEventListener('input', (e)=> updateCityList(e.target.value));
          updateCityList('');
          const nameEl = document.getElementById('detailName');
          const phoneEl = document.getElementById('detailPhone');
          const nameMsg = document.getElementById('nameMsg');
          const phoneMsg = document.getElementById('phoneMsg');
          nameEl.addEventListener('input', (e)=>{ const v = e.target.value; if(/\d/.test(v)){ nameEl.classList.add('invalid'); nameMsg.style.display='block'; } else { nameEl.classList.remove('invalid'); nameMsg.style.display='none'; } });
          phoneEl.addEventListener('input', (e)=>{ const v = e.target.value; if(/[A-Za-z]/.test(v)){ phoneEl.classList.add('invalid'); phoneMsg.style.display='block'; } else { phoneEl.classList.remove('invalid'); phoneMsg.style.display='none'; } });
          const actions=document.createElement('div');
          actions.style.display='flex';
          actions.style.justifyContent='space-between';
          actions.style.gap='8px';
          actions.style.marginTop='12px';
          const btnBack=document.createElement('button');
          btnBack.className='btn back-green';
          btnBack.textContent='Back to Items';
          btnBack.addEventListener('click', ()=> renderWishlistStep('items'));
          const btnNext=document.createElement('button');
          btnNext.className='btn proceed';
          btnNext.textContent='Proceed to Confirm';
          btnNext.addEventListener('click', ()=>{
            const name = nameEl.value.trim();
            const phone = phoneEl.value.trim();
            const city = document.getElementById('detailCity').value.trim();
            const address = document.getElementById('detailAddress').value.trim();
            let ok = true;
            if(!/^[A-Za-z\s]+$/.test(name)){ nameEl.classList.add('invalid'); nameMsg.style.display='block'; ok=false; } else { nameEl.classList.remove('invalid'); nameMsg.style.display='none'; }
            if(!/^\d+$/.test(phone)){ phoneEl.classList.add('invalid'); phoneMsg.style.display='block'; ok=false; } else { phoneEl.classList.remove('invalid'); phoneMsg.style.display='none'; }
            if(!city){ document.getElementById('detailCity').classList.add('invalid'); ok=false; } else document.getElementById('detailCity').classList.remove('invalid');
            if(!address){ document.getElementById('detailAddress').classList.add('invalid'); ok=false; } else document.getElementById('detailAddress').classList.remove('invalid');
            if(!ok) return;
            TEMP_ORDER.details = { name, phone, city, address };
            save(STORAGE.WISH + '_details', TEMP_ORDER.details);
            // next is confirm (3)
            transitionStep('details', dotsBetween2, 'confirm').then(()=> renderWishlistStep('confirm'));
          });
          actions.appendChild(btnBack);
          actions.appendChild(btnNext);
          wishlistContentArea.appendChild(actions);
        } else if(step === 'confirm'){
          // show summary and allow proceed to Payment (4)
          const itemsWrap=document.createElement('div');
          itemsWrap.style.marginTop='12px';
          WISHLIST.forEach(it=>{
            const p=findProductById(it.id);
            const lineTotal = it.qty * it.price;
            const row=document.createElement('div');
            row.style.display='flex';
            row.style.gap='8px';
            row.style.alignItems='center';
            row.style.padding='8px 0';
            row.innerHTML = `<img src="${p.imgs[0]}" style="width:64px;height:64px;object-fit:cover;border-radius:6px"><div style="flex:1"><div style="font-weight:700">${it.title}</div><div class="small">Options: ${Object.keys(it.options).map(k=>k+': '+it.options[k]).join(' · ')}</div></div><div style="text-align:right"><div style="font-weight:700">${it.qty} × ${formatPrice(it.price)}</div><div class="small">= ${formatPrice(lineTotal)}</div></div>`;
            itemsWrap.appendChild(row);
          });
          wishlistContentArea.appendChild(itemsWrap);
          const totals = calcTotals();
          const bottomTotal = document.createElement('div');
          bottomTotal.style.display = 'flex';
          bottomTotal.style.justifyContent = 'space-between';
          bottomTotal.style.alignItems = 'center';
          bottomTotal.style.marginTop = '12px';
          bottomTotal.innerHTML = `<div style="font-weight:700">Total</div><div id="confirmTotal" class="confirm-total">${formatPrice(totals.total)}</div>`;
          wishlistContentArea.appendChild(bottomTotal);
          const actions = document.createElement('div');
          actions.style.display = 'flex';
          actions.style.justifyContent = 'space-between';
          actions.style.gap = '8px';
          actions.style.marginTop = '12px';
          const btnBack = document.createElement('button');
          btnBack.className = 'btn back-green';
          btnBack.textContent = 'Back to Details';
          btnBack.addEventListener('click', () => renderWishlistStep('details'));
          const btnToPayment = document.createElement('button');
          btnToPayment.className = 'btn proceed';
          btnToPayment.textContent = 'Proceed to Payment';
          btnToPayment.addEventListener('click', ()=> {
            // go to payment step (4)
            transitionStep('confirm', dotsBetween3, 'payment').then(()=> renderWishlistStep('payment'));
          });
          actions.appendChild(btnBack);
          actions.appendChild(btnToPayment);
          wishlistContentArea.appendChild(actions);
        } else if(step === 'payment'){
          // Payment (4). Finalization occurs after payment verified.
          if(TEMP_ORDER.payment && TEMP_ORDER.paidSnapshot && TEMP_ORDER.paidSnapshot === snapshotWishlist()){
            const area = document.createElement('div');
            area.style.display='flex';
            area.style.flexDirection='column';
            area.style.alignItems='center';
            area.style.justifyContent='center';
            area.style.height='100%';
            area.innerHTML = `<div style="font-weight:900">You have already paid</div><div style="margin-top:12px"><svg class="tick-svg" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg"><path class="tick-path" d="M14 27 L22 34 L38 16" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
            wishlistContentArea.appendChild(area);
            setTimeout(()=> playSvgTick(area), 80);
            // after a small delay allow user to see final
            setTimeout(()=> { /* remain on payment */ }, 900);
            return;
          }
          const payWrap=document.createElement('div');
          payWrap.innerHTML = `<div style="font-weight:800">Choose payment method</div>`;
          const payGrid=document.createElement('div');
          payGrid.className='pay-grid';
          const methods=[{id:'Credit Card', label:'💳 Credit Card'},{id:'PayPal', label:'🅿️ PayPal'},{id:'FPS', label:'🏦 FPS'},{id:'Cash on Delivery', label:'🚚 Cash on Delivery'}];
          methods.forEach(m=>{
            const b=document.createElement('button');
            b.textContent=m.label;
            b.dataset.method=m.id;
            b.addEventListener('click', ()=>{
              Array.from(payGrid.children).forEach(x=> x.classList.remove('active'));
              b.classList.add('active');
              TEMP_ORDER.payment = TEMP_ORDER.payment || {};
              TEMP_ORDER.payment.method = m.id;
              TEMP_ORDER.payment.verified = false;
              const existing = wishlistContentArea.querySelector('.payment-process-inline');
              if(existing) existing.remove();
              if(m.id === 'Credit Card'){ payWrap.innerHTML = `<div style="font-weight:800">Credit Card</div>`; renderPaymentProcessCreditCard(payWrap); }
              else if(m.id === 'PayPal'){ payWrap.innerHTML = `<div style="font-weight:800">PayPal</div>`; renderPaymentProcessPayPal(payWrap); }
              else if(m.id === 'FPS'){ payWrap.innerHTML = `<div style="font-weight:800">FPS</div>`; renderPaymentProcessFPS(payWrap); }
              else { payWrap.innerHTML = `<div style="font-weight:800">Cash on Delivery</div>`; renderPaymentInline('Cash on Delivery'); }
            });
            payGrid.appendChild(b);
          });
          payWrap.appendChild(payGrid);
          wishlistContentArea.appendChild(payWrap);
          const actions=document.createElement('div');
          actions.style.display='flex';
          actions.style.justifyContent='space-between';
          actions.style.gap='8px';
          actions.style.marginTop='12px';
          const btnBack=document.createElement('button');
          btnBack.className='btn back-green';
          btnBack.textContent='Back to Confirm';
          btnBack.addEventListener('click', ()=> renderWishlistStep('confirm'));
          const btnNext=document.createElement('button');
          btnNext.className='btn proceed';
          btnNext.textContent='Finish (complete payment)';
          btnNext.addEventListener('click', ()=> {
            if(!TEMP_ORDER.payment || !TEMP_ORDER.payment.method){
              const v = document.createElement('div');
              v.style.color='var(--danger)';
              v.style.fontWeight='700';
              v.style.marginTop='8px';
              v.textContent='Please select a payment method';
              wishlistContentArea.appendChild(v);
              setTimeout(()=> v.remove(), 2200);
              return;
            }
            // For methods that require verification, they set TEMP_ORDER.payment.verified
            if(TEMP_ORDER.payment.method !== 'Cash on Delivery' && !TEMP_ORDER.payment.verified){
              const v = document.createElement('div');
              v.style.color='var(--danger)';
              v.style.fontWeight='700';
              v.style.marginTop='8px';
              v.textContent='Complete verification first';
              wishlistContentArea.appendChild(v);
              setTimeout(()=> v.remove(), 2200);
              return;
            }
            // finalize now
            finalizeOrderAfterPayment();
          });
          actions.appendChild(btnBack);
          actions.appendChild(btnNext);
          wishlistContentArea.appendChild(actions);
        }
      }

      /* finalize order after payment verified - moved from confirm to here */
      function finalizeOrderAfterPayment(){
        const totals = calcTotals();
        const orderId = 'ORD' + Date.now();
        const order = { id: orderId, ts: Date.now(), items: WISHLIST.map(i => ({ id: i.id, title: i.title, price: i.price, qty: i.qty, options: i.options })), total: totals.total, details: TEMP_ORDER.details || null, payment: TEMP_ORDER.payment || null, status: 'Processing' };
        ORDERS.unshift(order);
        persistAll();
        TEMP_ORDER.paidSnapshot = snapshotWishlist();
        TEMP_ORDER.payment = TEMP_ORDER.payment || {};
        TEMP_ORDER.payment.verified = true;
        // clear wishlist
        WISHLIST = [];
        persistAll();
        renderCartPreview();
        
        // Reset step animations and colors for next order
        checkoutSteps.querySelectorAll('.step').forEach(s=>{
          s.classList.remove('active');
          s.style.background='#f3f4f6';
          s.style.color='#111';
        });
        document.querySelector('.step[data-step="items"]').classList.add('active');
        document.querySelector('.step[data-step="items"]').style.background='var(--accent)';
        document.querySelector('.step[data-step="items"]').style.color='#fff';
        
        // Reset dot fills
        [dotsBetween1, dotsBetween2, dotsBetween3].forEach(container=>{
          Array.from(container.querySelectorAll('.dot .fill')).forEach(f=> f.style.width='0');
        });
        
        // show receipt-like confirmation in overlay
        wishlistContentArea.innerHTML = '';
        const area = document.createElement('div');
        area.style.display='flex';
        area.style.flexDirection='column';
        area.style.alignItems='center';
        area.style.justifyContent='center';
        area.style.gap='12px';
        area.style.minHeight='220px';
        const svgWrap = document.createElement('div');
        svgWrap.innerHTML = `<svg class="tick-svg" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg"><path class="tick-path" d="M14 27 L22 34 L38 16" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        area.appendChild(svgWrap);
        const msg = document.createElement('div');
        msg.style.fontWeight='900';
        msg.style.textAlign='center';
        msg.textContent = `Thank you — your order id is ${orderId}`;
        area.appendChild(msg);
        const btnRow = document.createElement('div');
        btnRow.style.display='flex';
        btnRow.style.gap='8px';
        btnRow.style.marginTop='8px';
        const pdfBtn = document.createElement('button');
        pdfBtn.className = 'btn';
        pdfBtn.textContent = 'Download PDF receipt';
        pdfBtn.addEventListener('click', ()=> generatePdfReceipt(order));
        const closeBtn = document.createElement('button');
        closeBtn.className = 'btn close-x';
        closeBtn.textContent = 'Close';
        closeBtn.addEventListener('click', ()=>{ wishlistOverlay.classList.remove('open'); wishlistOverlay.setAttribute('aria-hidden','true'); });
        btnRow.appendChild(pdfBtn);
        btnRow.appendChild(closeBtn);
        area.appendChild(btnRow);
        wishlistContentArea.appendChild(area);
        setTimeout(()=> playSvgTick(area), 80);
      }

      /* ======= Payment process helpers (credit card, paypal, fps) ======= */
      function renderPaymentInline(method){
        const area = document.createElement('div');
        area.className = 'payment-process-inline';
        area.style.marginTop = '12px';
        area.innerHTML = `<div style="font-weight:800">Selected: ${method}</div><div class="small" style="margin-top:8px">You can proceed to confirm. Payment method: <strong>${method}</strong></div>`;
        wishlistContentArea.appendChild(area);
        // reset animation objects
        TEMP_ORDER.payment = TEMP_ORDER.payment || {};
      }

      function renderPaymentProcessCreditCard(container){
        const proc = document.createElement('div');
        proc.style.marginTop = '12px';
        proc.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:8px">
            <div style="font-weight:700">Enter card number</div>
            <div style="display:flex;gap:8px">
              <input id="cc1" class="input" maxlength="4" style="width:80px" placeholder="1234">
              <input id="cc2" class="input" maxlength="4" style="width:80px" placeholder="5678">
              <input id="cc3" class="input" maxlength="4" style="width:80px" placeholder="9012">
              <input id="cc4" class="input" maxlength="4" style="width:80px" placeholder="3456">
            </div>
            <div id="ccCardMsg" class="validation-msg">Enter 16 digits</div>
            <div id="ccPendingArea" style="display:none;margin-top:12px">
              <div class="pending-wrap">
                <div class="spinner"></div>
                <div style="font-weight:700">Pending for Confirmation</div>
              </div>
              <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
                <input id="ccCodeInput" class="input" placeholder="Enter 6-digit code" style="width:160px" maxlength="6" />
                <button id="ccResend" class="btn">Resend</button>
                <div id="ccStatus" style="font-weight:700;color:var(--muted)"></div>
              </div>
            </div>
          </div>
        `;
        container.appendChild(proc);
        const cc1 = proc.querySelector('#cc1');
        const cc2 = proc.querySelector('#cc2');
        const cc3 = proc.querySelector('#cc3');
        const cc4 = proc.querySelector('#cc4');
        const ccMsg = proc.querySelector('#ccCardMsg');
        const pendingArea = proc.querySelector('#ccPendingArea');
        const codeInput = proc.querySelector('#ccCodeInput');
        const resendBtn = proc.querySelector('#ccResend');
        const status = proc.querySelector('#ccStatus');

        function checkCardComplete(){
          const full = (cc1.value||'') + (cc2.value||'') + (cc3.value||'') + (cc4.value||'');
          if(/^\d{16}$/.test(full)){
            ccMsg.style.display='none';
            pendingArea.style.display='block';
            status.textContent = 'Code sent';
            TEMP_ORDER.payment = TEMP_ORDER.payment || {};
            TEMP_ORDER.payment.method = 'Credit Card';
            TEMP_ORDER.payment.verified = false;
          } else {
            ccMsg.style.display='block';
          }
        }

        [cc1,cc2,cc3,cc4].forEach((el, idx, arr)=>{
          el.addEventListener('input', (e)=>{
            const v = e.target.value.replace(/\D/g,'').slice(0,4);
            e.target.value = v;
            if(v.length === 4 && idx < arr.length - 1) arr[idx+1].focus();
            checkCardComplete();
          });
        });

        resendBtn.addEventListener('click', ()=>{
          status.textContent = 'Code resent';
          showToast('Verification code resent', 900);
        });

        codeInput.addEventListener('input', (e)=>{
          const v = (e.target.value||'').trim();
          if(/^\d{6}$/.test(v)){
            TEMP_ORDER.payment = TEMP_ORDER.payment || {};
            TEMP_ORDER.payment.verified = true;
            status.textContent = 'Verified';
            status.style.color = 'var(--ok)';
            const overlay = document.createElement('div');
            overlay.style.marginTop = '12px';
            overlay.innerHTML = `<div style="display:flex;align-items:center;gap:12px"><div class="inline-tick"></div><div style="font-weight:700">Payment verified</div></div>`;
            container.appendChild(overlay);
            setTimeout(()=>{
              finalizeOrderAfterPayment();
            }, 420);
          }
        });
      }

      function renderPaymentProcessPayPal(container){
        const proc = document.createElement('div');
        proc.style.marginTop = '12px';
        proc.innerHTML = `
          <div class="pending-wrap">
            <div class="spinner"></div>
            <div style="font-weight:700">Redirecting to PayPal... awaiting confirmation</div>
          </div>
          <div style="margin-top:12px">If no confirmation received, click "Resend" to try again.</div>
          <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
            <button id="ppResend" class="btn">Resend</button>
            <div id="ppStatus" style="font-weight:700;color:var(--muted)"></div>
          </div>
        `;
        container.appendChild(proc);
        const resend = proc.querySelector('#ppResend');
        const status = proc.querySelector('#ppStatus');
        resend.addEventListener('click', ()=>{
          status.textContent = 'Processing...';
          setTimeout(()=>{
            status.textContent = 'Payment confirmed';
            status.style.color = 'var(--ok)';
            TEMP_ORDER.payment = TEMP_ORDER.payment || {};
            TEMP_ORDER.payment.method = 'PayPal';
            TEMP_ORDER.payment.verified = true;
            setTimeout(()=> finalizeOrderAfterPayment(), 600);
          }, 2000);
        });
      }

      function renderPaymentProcessFPS(container){
        const proc = document.createElement('div');
        proc.style.marginTop = '12px';
        proc.innerHTML = `
          <div style="display:flex;gap:12px;align-items:center">
            <div style="width:120px;height:80px;border-radius:8px;background:#f3f4f6;display:grid;place-items:center">QR</div>
            <div>
              <div style="font-weight:700">Scan QR with your banking app</div>
              <div class="small" style="margin-top:6px">Then enter the 6-digit confirmation code below</div>
            </div>
          </div>
          <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
            <input id="fpsCodeInput" class="input" placeholder="Enter 6-digit code" style="width:160px" maxlength="6" />
            <button id="fpsResend" class="btn">Resend</button>
            <div id="fpsStatus" style="font-weight:700;color:var(--muted)"></div>
          </div>
        `;
        container.appendChild(proc);
        const codeInput = proc.querySelector('#fpsCodeInput');
        const resendBtn = proc.querySelector('#fpsResend');
        const status = proc.querySelector('#fpsStatus');
        resendBtn.addEventListener('click', ()=> { status.textContent = 'Code resent'; showToast('FPS code resent', 900); });
        codeInput.addEventListener('input', (e)=>{
          const v = (e.target.value||'').trim();
          if(/^\d{6}$/.test(v)){
            status.textContent = 'Payment completed';
            status.style.color = 'var(--ok)';
            TEMP_ORDER.payment = TEMP_ORDER.payment || {};
            TEMP_ORDER.payment.method = 'FPS';
            TEMP_ORDER.payment.verified = true;
            setTimeout(()=> finalizeOrderAfterPayment(), 420);
          }
        });
      }

      /* ======= Utility: generate simple PDF receipt (jsPDF) ======= */
      async function generatePdfReceipt(order){
        try{
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ unit: 'pt', format: 'a4' });
          doc.setFontSize(18);
          doc.text('Receipt', 40, 60);
          doc.setFontSize(11);
          doc.text(`Order: ${order.id}`, 40, 90);
          doc.text(`Date: ${new Date(order.ts).toLocaleString()}`, 40, 108);
          let y = 140;
          doc.setFontSize(10);
          doc.text('Items:', 40, y);
          y += 18;
          order.items.forEach(it=>{
            const line = `${it.qty} x ${it.title} @ ${formatPrice(it.price)} = ${formatPrice(it.qty * it.price)}`;
            doc.text(line, 48, y);
            y += 16;
            if(y > 720){ doc.addPage(); y = 40; }
          });
          y += 12;
          doc.setFontSize(12);
          doc.text(`Total: ${formatPrice(order.total)}`, 40, y);
          const blob = doc.output('blob');
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${order.id}_receipt.pdf`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('PDF receipt generated', 1200);
        }catch(err){
          console.error(err);
          showToast('Failed to generate PDF', 1200);
        }
      }

      /* ======= UI bindings and initialization ======= */
      floatingCartBtn.addEventListener('click', ()=>{
        wishlistOverlay.classList.add('open');
        wishlistOverlay.setAttribute('aria-hidden','false');
        renderWishlistStep('items');
      });
      document.getElementById('closeWishlist').addEventListener('click', ()=>{
        wishlistOverlay.classList.remove('open');
        wishlistOverlay.setAttribute('aria-hidden','true');
      });
      wishlistOverlay.addEventListener('click', (e)=>{
        if(e.target === wishlistOverlay){
          wishlistOverlay.classList.remove('open');
          wishlistOverlay.setAttribute('aria-hidden','true');
        }
      });
      closeReceipt.addEventListener('click', ()=>{
        receiptModal.style.display = 'none';
        downloadPdf.style.display = 'none';
        receiptMessage.textContent = '';
      });
      document.getElementById('closeOrderModal').addEventListener('click', ()=> document.getElementById('orderModal').style.display='none');
      window.addEventListener('keydown', (e)=>{
        if(e.key === 'Escape'){
          if(document.getElementById('productModalBackdrop').style.display === 'flex') closeProductModal();
          if(document.getElementById('orderModal').style.display === 'flex') document.getElementById('orderModal').style.display='none';
          if(receiptModal.style.display === 'flex') { receiptModal.style.display = 'none'; downloadPdf.style.display = 'none'; receiptMessage.textContent = ''; }
        }
      });
      document.getElementById('brandHome').addEventListener('click', ()=>{
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(()=> location.reload(), 300);
      });

      (function initPreviewTotals(){ const initialTotals = calcTotals(); const previewEl = document.getElementById('previewTotal'); if(previewEl){ previewEl.dataset.prev = initialTotals.total; previewEl.textContent = formatPrice(initialTotals.total); previewEl.classList.add('confirm-total'); } cartTotalPriceFloating.textContent = formatPrice(initialTotals.total); cartCountBadgeFloating.textContent = initialTotals.count; })();

      renderProducts(PRODUCTS);
      renderCartPreview();
      renderHistoryPreview();
      renderPopular();

      try{ const savedDetails = load(STORAGE.WISH + '_details', null); if(savedDetails) TEMP_ORDER.details = savedDetails; }catch(e){}

      window._shop = { PRODUCTS, WISHLIST, ORDERS, renderProducts, renderCartPreview, renderWishlistStep, calcTotals };

      persistAll();

      window._shopClear = function(){ localStorage.removeItem(STORAGE.WISH); localStorage.removeItem(STORAGE.HISTORY); localStorage.removeItem(STORAGE.ORDERS); location.reload(); };

      document.addEventListener('click', (e)=>{ if(!moreExtended.contains(e.target) && !Array.from(document.querySelectorAll('.pill')).some(p=> p.contains(e.target))){ moreExtended.classList.remove('open'); moreExtended.style.display='none'; } });

      window.addEventListener('resize', ()=>{ if(moreExtended.classList.contains('open')){ const moreBtn = Array.from(document.querySelectorAll('.pill')).find(b=> b.textContent.includes('More')); if(moreBtn){ const rect = moreBtn.getBoundingClientRect(); moreExtended.style.left = rect.left + 'px'; moreExtended.style.top = (rect.bottom + 6) + 'px'; } } });

      document.getElementById('cartPreview').addEventListener('wheel', (e)=>{ if(Math.abs(e.deltaX) > Math.abs(e.deltaY)) e.preventDefault(); }, { passive: false });

      document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') { const el = document.getElementById('previewTotal'); if(el) animateNumberFromElement(el, calcTotals().total, 300); } });

      wishlistOverlay.addEventListener('keydown', (e)=>{ if(e.key === 'Tab'){ const focusable = wishlistOverlay.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'); if(!focusable.length) return; const first = focusable[0], last = focusable[focusable.length - 1]; if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); } } });

      console.log('Smile & Sunshine Toy Demo initialized', { products: PRODUCTS.length, wishlist: WISHLIST.length, orders: ORDERS.length });
    </script>
