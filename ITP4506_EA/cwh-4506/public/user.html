<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Smile &amp; Sunshine Toy — Order System (Updated)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #16a34a;
        --bg: #f7fafc;
        --panel: #fff;
        --text: #0b1b23;
        --muted: #475569;
        --shadow: 0 10px 30px rgba(11, 18, 32, 0.06);
        --anim-ease: cubic-bezier(.2, .9, .2, 1);
        --danger: #ef4444;
        --primary: #2563eb;
        --ok: #22c55e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, Arial;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      /* header */
      .site-header {
        position: sticky;
        top: 0;
        background: #fff;
        z-index: 160;
        box-shadow: var(--shadow);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 18px;
      }

      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        cursor: pointer;
      }

      .logo {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent), #0a8a4a);
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 900;
      }

      .site-name {
        font-weight: 900;
      }

      .site-path {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .search-area {
        flex: 1;
        display: flex;
        justify-content: center;
        padding: 0;
      }

      .search-input {
        width: 520px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #e6eef3;
        margin: 0;
      }

      /* actions: order history + browsing history */
      .top-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .clock {
        background: transparent;
        border: 0;
        font-size: 28px;
        cursor: pointer;
      }

      /* categories */
      .categories-wrap {
        background: #fff;
        border-top: 1px solid #eef3f3;
        border-bottom: 1px solid #eef3f3;
      }

      .categories-inner {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 6px 18px;
        position: relative;
      }

      .categories-left-space,
      .categories-right-space {
        width: 0;
      }

      .categories {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: auto;
        grid-template-rows: repeat(2, auto);
        gap: 8px;
        align-items: center;
        justify-content: center;
        overflow: visible;
        white-space: normal;
      }

      .categories.abstracted {
        grid-template-rows: 1fr;
        overflow: hidden;
        white-space: nowrap;
      }

      .categories.expanded {
        grid-template-rows: repeat(3, auto);
        overflow: visible;
        white-space: normal;
      }

      .pill {
        min-width: 56px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid #e6eef3;
        background: #fff;
        cursor: pointer;
      }

      .pill.active {
        background: var(--accent);
        color: #fff;
      }

      .more-extended {
        position: fixed;
        display: none;
        background: #fff;
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 8px;
        z-index: 220;
        max-width: 360px;
        overflow: auto;
      }

      .more-extended.open {
        display: block;
      }

      /* layout */
      .page {
        padding: 18px;
      }

      .layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 18px;
        margin: 0 auto;
        width: 100%;
        box-sizing: border-box;
      }

      .left-col {
        position: sticky;
        top: 120px;
        align-self: start;
      }

      .center-col {
        align-self: start;
        padding-left: 9px;
        padding-right: 12px;
      }

      /* ad carousel */
      .ad-carousel {
        position: relative;
        width: 100%;
        height: 420px;
        overflow: hidden;
        border-radius: 12px;
        background: #fff;
        box-shadow: var(--shadow);
      }

      .ad-track {
        display: flex;
        height: 100%;
        transition: transform .6s var(--anim-ease);
      }

      .ad-slide {
        flex: 0 0 100%;
        height: 100%;
        position: relative;
      }

      .ad-inner {
        width: 100%;
        height: 100%;
      }

      .ad-inner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .ad-caption {
        position: absolute;
        left: 16px;
        bottom: 16px;
        background: rgba(0, 0, 0, 0.56);
        color: #fff;
        padding: 10px 14px;
        border-radius: 8px;
        font-weight: 800;
      }

      .ad-control {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        cursor: pointer;
      }

      .ad-prev {
        left: 12px;
      }

      .ad-next {
        right: 12px;
      }

      .ad-dots {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 12px;
        display: flex;
        gap: 8px;
      }

      /* product grid */
      .group-cards.group-3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .row-5 {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }

      .card {
        background: var(--panel);
        border-radius: 12px;
        padding: 12px;
        box-shadow: var(--shadow);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        min-height: calc(360px + 1cm);
        position: relative;
      }

      /* increased by ~1cm */
      .thumb {
        height: calc(220px + 1cm);
        border-radius: 8px;
        overflow: hidden;
        background: #f0fbf6;
      }

      /* increased by 1cm */
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px 6px;
        flex: 1;
      }

      .title {
        font-weight: 800;
        text-align: center;
      }

      .meta {
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
      }

      .options-centered {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        margin-top: 6px;
        flex-wrap: wrap;
      }

      .counter {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
      }

      .count-input {
        width: 64px;
        padding: 6px;
        border-radius: 8px;
        border: 1px solid #e6eef3;
        text-align: center;
      }

      .btn-counter {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid #e6eef3;
        background: #fff;
        cursor: pointer;
        z-index: 2;
      }

      /* add button moved slightly up so it doesn't cover + and lowered z-index so + is clickable */
      .add-to-wish {
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        border: 0;
        cursor: pointer;
        position: absolute;
        right: 12px;
        bottom: 22px;
        box-shadow: 0 8px 20px rgba(10, 120, 60, 0.12);
        z-index: 1;
      }

      /* left panel */
      .price-panel {
        background: #fff;
        padding: 12px;
        border-radius: 8px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .price-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .manual-inputs {
        display: none;
        flex-direction: column;
        gap: 8px;
        margin-top: 8px;
      }

      .popular-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 6px;
      }

      .popular-item {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px;
        border-radius: 8px;
        background: #fbfffb;
        border: 1px solid #eef6ee;
        cursor: pointer;
      }

      /* floating wishlist (preview) */
      /* increased preview size so remove and price visible */
      .floating-cart {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 220;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
      }

      .cart-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), #0a8a4a);
        color: #fff;
        cursor: pointer;
      }

      .cart-price {
        font-weight: 900;
        transition: transform .12s var(--anim-ease);
      }

      .cart-count {
        background: #fff;
        color: var(--accent);
        padding: 4px 8px;
        border-radius: 999px;
        font-weight: 900;
        min-width: 28px;
        text-align: center;
        transition: transform .12s var(--anim-ease);
      }

      .cart-preview {
        position: absolute;
        right: 0;
        bottom: 72px;
        width: 480px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 30px 80px rgba(11, 18, 32, 0.18);
        height: 10cm;
        display: flex;
        flex-direction: column;
        opacity: 0;
        pointer-events: none;
        transition: opacity .18s, transform .18s;
        overflow: hidden;
      }

      .cart-preview.open {
        opacity: 1;
        pointer-events: auto;
      }

      .preview-head {
        padding: 10px;
        border-bottom: 1px dashed #eef3f3;
        font-weight: 800;
        color: var(--accent);
      }

      .preview-content {
        flex: 1;
        overflow: auto;
        padding: 10px;
        /* prevent horizontal scroll */
        overflow-x: hidden;
        cursor: pointer;
      }

      .preview-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: flex-start;
        padding: 10px 6px;
        border-bottom: 1px dashed #eef3f3;
      }

      .preview-item .left {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        min-width: 0;
      }

      .preview-item .left img {
        width: 48px;
        height: 48px;
        border-radius: 6px;
        object-fit: cover;
        flex-shrink: 0;
      }

      .preview-item .left > div {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        overflow: hidden;
      }

      .preview-item .left .title {
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .preview-item .left .price {
        font-size: 13px;
        color: var(--muted);
        white-space: nowrap;
      }

      .preview-item .right {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .preview-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 10px;
        border-top: 1px dashed #eef3f3;
      }

      .clear-wish {
        border: 1px solid #e6eef3;
        background: #fff;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }

      .revert-wish {
        border: 1px solid #e6eef3;
        background: #fff;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        margin-left:8px;
      }

      /* wishlist overlay */
      .wishlist-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
        z-index: 300;
      }

      .wishlist-overlay.open {
        display: flex;
      }

      .wishlist-panel {
        background: #fff;
        border-radius: 12px;
        padding: 18px;
        width: min(920px, 96%);
        min-height: 21cm;
        max-height: 21cm;
        overflow: auto;
        box-shadow: 0 30px 80px rgba(11, 18, 32, 0.28);
      }

      /* fixed 21cm height */
      .wishlist-rows {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .wishlist-item {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px;
        border-bottom: 1px dashed #eef3f3;
        cursor: pointer;
      }

      .wishlist-item img {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
      }

      /* circle instead of square */
      .wishlist-controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      /* steps and dots inline between labels */
      /* We'll render 3 dots between each step (9 total) */
      .steps {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .step {
        padding: 8px 12px;
        border-radius: 999px;
        background: #f3f4f6;
        color: #111;
        font-weight: 700;
        cursor: default;
      }

      .step.active {
        background: var(--accent);
        color: #fff;
      }

      .progress-dots {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-left: 8px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #e6eef3;
        position: relative;
        overflow: hidden;
      }

      .dot .fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 0;
        background: var(--accent);
        transition: width 320ms linear;
      }

      /* details form */
      .details-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 12px;
      }

      .detail-box {
        background: #fbfffb;
        border: 1px solid #eef6ee;
        padding: 12px;
        border-radius: 8px;
        min-height: 64px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .detail-box label {
        font-weight: 700;
        margin-bottom: 6px;
      }

      .input {
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #e6eef3;
        width: 100%;
      }

      /* payment grid 2x2 */
      .pay-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }

      .pay-grid button {
        padding: 18px;
        border-radius: 10px;
        border: 1px solid #e6eef3;
        background: #fff;
        cursor: pointer;
        font-weight: 800;
        font-size: 16px;
      }

      .pay-grid button.active {
        background: var(--accent);
        color: #fff;
        border-color: transparent;
      }

      /* proceed button style (green background white text) */
      .btn.proceed {
        background: var(--accent);
        color: #fff;
        border: 0;
        padding: 12px 18px;
        border-radius: 8px;
        font-weight: 800;
      }

      /* close X button style (red background white text) */
      .btn.close-x {
        background: #ef4444;
        color: #fff;
        border: 0;
        padding: 8px 10px;
        border-radius: 8px;
        font-weight: 800;
      }

      /* remove button green in items */
      .btn.remove-green {
        background: var(--accent);
        color: #fff;
        border: 0;
        padding: 8px 10px;
        border-radius: 8px;
        font-weight: 800;
      }

      /* back button green in details/payment/confirm */
      .btn.back-green {
        background: var(--accent);
        color: #fff;
        border: 0;
        padding: 8px 10px;
        border-radius: 8px;
        font-weight: 800;
      }

      /* small circular +/- buttons in preview and items */
      .wishlist-controls .minus,
      .wishlist-controls .plus {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        border: 1px solid #e6eef3;
        background: #fff;
        cursor: pointer;
        padding: 0;
        z-index: 2;
      }

      .wishlist-controls .qty {
        width: 56px;
        text-align: center;
        border-radius: 8px;
        padding: 6px;
      }

      /* validation */
      .input.invalid {
        border-color: var(--danger);
        box-shadow: 0 6px 18px rgba(239, 68, 68, 0.06);
      }

      .validation-msg {
        color: var(--danger);
        font-size: 13px;
        margin-top: 6px;
        display: none;
      }

      /* pending animation (classic) */
      .pending-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 3px solid rgba(0, 0, 0, 0.08);
        border-top-color: var(--accent);
        animation: spin 700ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* tick animation: draw path */
      .tick-svg {
        width: 160px;
        height: 160px;
      }

      .tick-path {
        fill: none;
        stroke: var(--ok);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        transition: stroke-dashoffset 520ms ease;
      }

      .tick-path.drawn {
        stroke-dashoffset: 0;
      }

      /* inline tick */
      .inline-tick {
        width: 36px;
        height: 36px;
        border-radius: 6px;
        background: var(--ok);
        display: grid;
        place-items: center;
        color: #fff;
        flex: 0 0 36px;
      }

      /* confirm total green */
      .confirm-total {
        font-weight: 900;
        color: var(--ok);
        font-size: 1.05rem;
      }

      /* wishlist preview clickable */
      .preview-content .preview-item {
        cursor: pointer;
      }

      /* responsive */
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .left-col {
          position: static;
        }

        .ad-carousel {
          height: 220px;
        }

        .group-cards.group-3 {
          grid-template-columns: repeat(2, 1fr);
        }

        .row-5 {
          grid-template-columns: repeat(2, 1fr);
        }

        .details-grid {
          grid-template-columns: 1fr;
        }

        .search-input {
          width: 100%;
          max-width: 420px;
        }

        .more-extended { max-width: calc(100% - 24px); left: 12px !important; }
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <div class="topbar">
        <div class="brand" id="brandHome" title="Click to refresh and go top">
          <div class="logo">S</div>
          <div>
            <div class="site-name">Smile &amp; Sunshine Toy</div>
            <div class="site-path">Home / Toys</div>
          </div>
        </div>

        <div class="search-area">
          <input id="q" class="search-input" placeholder="Search products..." />
        </div>

        <div class="top-actions">
          <div
            id="orderHistoryWrap"
            style="position:relative;display:inline-flex;align-items:center;z-index:350"
          >
            <button id="orderHistoryBtn" class="clock" title="Order history">📦</button>
            <span class="history-label">Order history</span>
          </div>

          <div
            class="history-clock-wrap"
            id="historyWrap"
            title="Hover to see browsing history"
            style="position:relative;display:inline-flex;align-items:center"
          >
            <button id="historyClock" class="clock" title="Browsing history">⏱</button>
            <span class="history-label">Browsing history</span>
            <div class="history-clock-badge" aria-hidden="true"></div>
          </div>
        </div>
      </div>

      <div class="categories-wrap">
        <div class="categories-inner">
          <div class="categories-left-space"></div>
          <div id="categories" class="categories"></div>
          <div class="categories-right-space"></div>
        </div>
      </div>
    </header>

    <main class="page">
      <div class="layout">
        <aside class="left-col">
          <div class="price-panel" id="pricePanel">
            <div class="price-section">
              <label style="font-weight:700">Price range</label>
              <select id="priceMenu" class="input">
                <option value="">All</option>
                <option value="0-50">0 - 50</option>
                <option value="50-100">50 - 100</option>
                <option value="100-150">100 - 150</option>
                <option value="150-200">150 - 200</option>
                <option value="200-250">200 - 250</option>
                <option value="250-300">250 - 300</option>
                <option value="300-350">300 - 350</option>
                <option value="350-400">350 - 400</option>
                <option value="400-450">400 - 450</option>
                <option value="450-500">450 - 500</option>
                <option value="customize">Customize</option>
              </select>
              <div class="manual-inputs" id="manualInputs">
                <input id="manualMin" class="input" placeholder="Min" />
                <input id="manualMax" class="input" placeholder="Max" />
                <button id="applyManual" class="btn">Apply</button>
              </div>
            </div>

            <div class="popular-section" id="popularSection" aria-label="Popular items">
              <div style="font-weight:800">Popular</div>
              <div class="popular-list" id="popularList"></div>
            </div>
          </div>
        </aside>

        <section class="center-col">
          <div id="adCarousel" class="ad-carousel" tabindex="0" aria-roledescription="carousel">
            <div class="ad-track" id="adTrack"></div>
            <button id="adPrev" class="ad-control ad-prev" aria-label="Previous slide">‹</button>
            <button id="adNext" class="ad-control ad-next" aria-label="Next slide">›</button>
            <div id="adDots" class="ad-dots" role="tablist"></div>
          </div>

          <div style="height:18px"></div>

          <div id="group1" class="group-cards group-3"></div>
          <div id="group2" class="group-cards group-3" style="margin-top:12px"></div>
          <div id="multiRows" class="multi-rows" style="margin-top:12px"></div>
        </section>
      </div>
    </main>

    <script>
      /* ======= Utilities & persistence ======= */
      const STORAGE = { WISH: 'shop_demo_wishlist_v3', HISTORY: 'shop_demo_history_v3', ORDERS: 'shop_demo_orders_v3' };
      function save(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){} }
      function load(key, fallback){ try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; } }
      function formatPrice(n){ return '$' + Number(n||0).toFixed(2); }
      function showToast(text, ms=1200){ const t=document.createElement('div'); t.style.background='#0b1b23'; t.style.color='#fff'; t.style.padding='10px 14px'; t.style.borderRadius='10px'; t.style.boxShadow='0 10px 30px rgba(11,18,32,0.2)'; t.textContent=text; document.getElementById('toastWrap').appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(6px)'; }, ms-300); setTimeout(()=> t.remove(), ms); }

      /* ======= Data ======= */

          id: i,

          meta: i%3===0 ? 'Tailor-made' : (i%3===1 ? 'Soft plush' : 'Educational'),

          tag: (i%5===1) ? 'Doll' : (i%5===2) ? 'Robot' : (i%5===3) ? 'Puzzle' : (i%5===4) ? 'Plush' : 'Car',

        // seed a sample historic order - will be shown in order history panel
        { id: 'ORD1764924094408', ts: new Date('2025-12-05T16:41:34').getTime(), items: [], total: 17935, status: 'Delivered' } // requested specific order

      /* ======= Helpers ======= */
      function persistAll(){ save(STORAGE.WISH, WISHLIST); save(STORAGE.HISTORY, HISTORY); save(STORAGE.ORDERS, ORDERS); save(STORAGE.WISH + '_details', TEMP_ORDER.details); }
      function findProductById(id){ return PRODUCTS.find(p=>p.id===Number(id)); }
      function keyFor(p, options){ return JSON.stringify({id:p.id, options: options || {}}); }
      function calcTotals(){ const total = WISHLIST.reduce((s,it)=> s + (it.qty * it.price), 0); const count = WISHLIST.reduce((s,it)=> s + it.qty, 0); return { total, count }; }
      function snapshotWishlist(){ return JSON.stringify(WISHLIST.map(i=> ({id:i.id, qty:i.qty, price:i.price, options:i.options}) )); }

      /* ======= Number animation helper (uses previous value if present) ======= */
      function animateNumberFromElement(el, to, duration=400){ if(!el) return; const prev = Number((el.dataset.prev || '0')); const from = prev; el.dataset.prev = to; const start = performance.now(); const diff = to - from; function step(ts){ const t = Math.min(1, (ts - start)/duration); const val = Math.floor(from + diff * t); el.textContent = formatPrice(val); if(t < 1) requestAnimationFrame(step); else el.textContent = formatPrice(to); } requestAnimationFrame(step); }

      /* animate integer sequence for counts (1..5 or 5..1) quickly */
      function animateCountSequence(el, from, to, msTotal=300){ if(!el) return; const steps = Math.min(6, Math.abs(to - from) + 1); if(steps <= 1){ el.textContent = String(to); return; } const dir = to > from ? 1 : -1; const stepTime = Math.max(30, Math.floor(msTotal / steps)); let cur = from; let i = 0; const timer = setInterval(()=>{ cur = from + dir * (++i); el.textContent = String(cur); if((dir === 1 && cur >= to) || (dir === -1 && cur <= to) || i >= steps){ clearInterval(timer); el.textContent = String(to); } }, stepTime); }

      /* animate price sequence by stepping in small increments (rapid) */
      function animatePriceSequence(el, from, to, msTotal=300){
        if(!el) return;
        const diff = to - from;
        const steps = Math.max(1, Math.ceil(Math.abs(diff) / 5));
        const stepTime = Math.max(20, Math.floor(msTotal / steps));
        let i = 0;
        const timer = setInterval(()=>{
          i++;
          const val = Math.round(from + (diff * (i / steps)));
          el.textContent = formatPrice(val);
          if(i >= steps){
            clearInterval(timer);
            el.textContent = formatPrice(to);
          }
        }, stepTime);
      }
      /* ======= Hold acceleration helper (shared) ======= */
      function attachHoldStages(btn, delta, inputEl){ if(!btn) return; const delays=[420,420,200,120,60,18]; let timer=null, stage=0, running=false; function doStep(){ const el=inputEl||btn.closest('.card')?.querySelector('.count-input'); if(!el) return; const v=parseInt(el.value||'0',10)||0; el.value=Math.max(1, v+delta); el.dispatchEvent(new Event('input',{bubbles:true})); } function loop(){ if(!running) return; stage=Math.min(stage+1, delays.length-1); timer=setTimeout(()=>{ doStep(); loop(); }, delays[stage]); } function start(e){ if(e && e.cancelable) e.preventDefault(); if(running) return; running=true; stage=0; doStep(); timer=setTimeout(loop, delays[0]); window.addEventListener('mouseup', stop); window.addEventListener('touchend', stop); window.addEventListener('touchcancel', stop); } function stop(){ running=false; stage=0; if(timer){ clearTimeout(timer); timer=null; } window.removeEventListener('mouseup', stop); window.removeEventListener('touchend', stop); window.removeEventListener('touchcancel', stop); } btn.addEventListener('mousedown', start); btn.addEventListener('touchstart', start, {passive:false}); btn.addEventListener('mouseup', stop); btn.addEventListener('mouseleave', stop); btn.addEventListener('touchend', stop); }

      /* ======= Categories: fill with real categories and "more" content (selectable & cancelable) ======= */
      (function initCategories(){
        const ALL = ['Doll','Robot','Puzzle','Plush','Car','Train','Action Figure','Board Game','Educational','Outdoor','Art','Building','RC','Collectible','Soft Toy','Wooden','Electronic','Vehicle','Miniature','Science','Music','Sports','Bath','Baby','Pet Toy','Model','Stickers','Cards','Blocks','Role Play','Crafts'];
        let isAbstracted=false;
        
        function renderTwoRows(){
          categoriesEl.classList.remove('expanded','abstracted');
          categoriesEl.innerHTML='';
          ALL.slice(0,12).forEach(letter=>{
            const b=document.createElement('button');
            b.className='pill';
            b.textContent=letter;
            b.dataset.letter=letter;
            b.addEventListener('click', ()=>{ b.classList.toggle('active'); applyCategoryFilters(); });
            categoriesEl.appendChild(b);
          });
          const more=document.createElement('button');
          more.className='pill';

            e.stopPropagation();
            // toggle moreExtended
            if(moreExtended.classList.contains('open')){
              moreExtended.classList.remove('open');
              moreExtended.style.display='none';
              return;
            }
            moreExtended.innerHTML='';
            const box=document.createElement('div');
            box.style.display='grid';
            box.style.gridTemplateColumns='repeat(3,1fr)';
            box.style.gap='6px';
            ALL.slice(12).forEach(cat=>{
              const p=document.createElement('button');
              p.className='pill';
              p.textContent=cat;
              p.style.padding='6px';
              p.style.fontSize='12px';
              // selected visual inside the more box only
              p.dataset.selected = 'false';
              p.addEventListener('click', ()=>{ // toggle visual selection inside more box
                p.dataset.selected = p.dataset.selected === 'true' ? 'false' : 'true';
                p.style.background = p.dataset.selected === 'true' ? 'var(--accent)' : '#fff';
                p.style.color = p.dataset.selected === 'true' ? '#fff' : '#111';
              });
              box.appendChild(p);
            });
            const closeBtn = document.createElement('div');
            closeBtn.style.display='flex';
            closeBtn.style.justifyContent='flex-end';
            closeBtn.style.marginTop='6px';
            closeBtn.style.gridColumn='1 / -1';
            const cbtn = document.createElement('button');
            cbtn.textContent = 'Close';
            cbtn.className='btn';
            cbtn.addEventListener('click', ()=> { moreExtended.classList.remove('open'); moreExtended.style.display='none'; });
            closeBtn.appendChild(cbtn);
            moreExtended.appendChild(box);
            moreExtended.appendChild(closeBtn);
            const rect = more.getBoundingClientRect();
            moreExtended.style.left = rect.left + 'px';
            moreExtended.style.top = (rect.bottom + 6) + 'px';
            moreExtended.classList.add('open');
            moreExtended.style.display = 'block';
          });
          categoriesEl.appendChild(more);
        }
        
        function renderAbstractedOneRow(){
          isAbstracted=true;
          categoriesEl.classList.add('abstracted');
          // When abstracted (one row) show first 9 + more button
          categoriesEl.innerHTML='';
          ALL.slice(0,9).forEach(letter=>{
            const b=document.createElement('button');
            b.className='pill';
            b.textContent=letter;
            b.dataset.letter=letter;
            b.addEventListener('click', ()=>{ b.classList.toggle('active'); applyCategoryFilters(); });
            categoriesEl.appendChild(b);
          });
          const more=document.createElement('button');
          more.className='pill';
          more.textContent='More ▾';
          more.addEventListener('click', (e)=>{
            e.stopPropagation();
            if(moreExtended.classList.contains('open')){
              moreExtended.classList.remove('open');
              moreExtended.style.display='none';
              return;
            }
            moreExtended.innerHTML='';
            const box=document.createElement('div');
            box.style.display='grid';
            box.style.gridTemplateColumns='repeat(3,1fr)';
            box.style.gap='6px';
            ALL.slice(9).forEach(cat=>{
              const p=document.createElement('button');
              p.className='pill';
              p.textContent=cat;
              p.style.padding='6px';
              p.style.fontSize='12px';
              p.dataset.selected = 'false';
              p.addEventListener('click', ()=>{
                p.dataset.selected = p.dataset.selected === 'true' ? 'false' : 'true';
                p.style.background = p.dataset.selected === 'true' ? 'var(--accent)' : '#fff';
                p.style.color = p.dataset.selected === 'true' ? '#fff' : '#111';
              });
              box.appendChild(p);
            });
            const closeBtn = document.createElement('div');
            closeBtn.style.display='flex';
            closeBtn.style.justifyContent='flex-end';
            closeBtn.style.marginTop='6px';
            closeBtn.style.gridColumn='1 / -1';
            const cbtn = document.createElement('button');
            cbtn.textContent = 'Close';
            cbtn.className='btn';
            cbtn.addEventListener('click', ()=> { moreExtended.classList.remove('open'); moreExtended.style.display='none'; });
            closeBtn.appendChild(cbtn);
            moreExtended.appendChild(box);
            moreExtended.appendChild(closeBtn);
            const rect = more.getBoundingClientRect();
            moreExtended.style.left = rect.left + 'px';
            moreExtended.style.top = (rect.bottom + 6) + 'px';
            moreExtended.classList.add('open');
            moreExtended.style.display = 'block';
          });
          categoriesEl.appendChild(more);
        }
        
        function applyCategoryFilters(){
          const actives = Array.from(categoriesEl.querySelectorAll('.pill.active')).map(b=> b.textContent);
          let list = PRODUCTS.slice();

            list = list.filter(p => actives.includes(p.tag));
          }
          renderProducts(list.length ? list : PRODUCTS);
        }
        
        window.addEventListener('scroll', ()=>{
          const threshold=120;

              isAbstracted=false;

        document.querySelector('.categories-inner').addEventListener('mouseleave', ()=>{

        window.addEventListener('resize', ()=>{
          if(isAbstracted) renderAbstractedOneRow();
          else renderTwoRows();
        });
        
        renderTwoRows();
      })();

      /* close moreExtended on scroll or leave */
      document.addEventListener('scroll', ()=>{
        if(moreExtended.classList.contains('open')){
          moreExtended.classList.remove('open');
          moreExtended.style.display='none';
        }
      });
      document.addEventListener('click', (e)=>{
        if(!moreExtended.contains(e.target) && !Array.from(document.querySelectorAll('.pill')).some(p=> p.contains(e.target))){
          moreExtended.classList.remove('open');

      /* ======= Ad carousel (fills box) ======= */
      (function initAd(){
        const images=[
          'https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1200&auto=format&fit=crop',
          'https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1200&auto=format&fit=crop',
          'https://images.unsplash.com/photo-1509223197845-458d87318791?q=80&w=1200&auto=format&fit=crop'
        ];
        adTrack.innerHTML='';
        images.forEach((src,i)=>{
          const slide=document.createElement('div');
          slide.className='ad-slide';
          slide.innerHTML = `<div class="ad-inner"><img src="${src}" alt=""><div class="ad-caption">Slide ${i+1}</div></div>`;
          adTrack.appendChild(slide);
        });
        const slides=Array.from(adTrack.children);
        let idx=0, timer=null, interval=3500;
        adDots.innerHTML='';
        slides.forEach((s,i)=>{
          const d=document.createElement('button');
          d.className='ad-dot';
          d.dataset.index=i;
          d.addEventListener('click', ()=> goTo(i));
          adDots.appendChild(d);
        });
        function update(){ const w = document.getElementById('adCarousel').getBoundingClientRect().width || window.innerWidth; adTrack.style.transform = `translateX(${-idx*w}px)`; Array.from(adDots.children).forEach((d,i)=> d.classList.toggle('active', i===idx)); }
        function goTo(i){ idx=(i+slides.length)%slides.length; update(); restart(); }
        function next(){ goTo(idx+1); }
        function prev(){ goTo(idx-1); }
        function start(){ stop(); timer=setInterval(next, interval); }
        function stop(){ if(timer){ clearInterval(timer); timer=null; } }
        function restart(){ stop(); start(); }
        document.getElementById('adPrev').addEventListener('click', prev);
        document.getElementById('adNext').addEventListener('click', next);
        window.addEventListener('resize', update);
        document.getElementById('adCarousel').addEventListener('mouseenter', stop);
        document.getElementById('adCarousel').addEventListener('mouseleave', start);
        update();
        start();
      })();

      /* ======= Render products & product card behavior ======= */
      function createCard(p){
        const card=document.createElement('div');
        card.className='card';
        card.dataset.id=p.id;
        card.innerHTML = `
          <div class="thumb"><img src="${p.imgs[0]}" alt="${p.title}"></div>
          <div class="card-body">
            <div class="title">${p.title}</div>
            <div class="meta">${p.meta} · ${formatPrice(p.price)}</div>
            <div class="options-centered"></div>
            <div class="counter" aria-hidden="true">
              <button class="btn-counter minus">-</button>
              <input class="count-input" type="number" min="1" value="1" aria-label="qty">
              <button class="btn-counter plus">+</button>
            </div>
          </div>
          <button class="add-to-wish">Add</button>
        `;
        const optsWrap = card.querySelector('.options-centered');
        if(p.options){
          Object.keys(p.options).forEach(k=>{
            const box=document.createElement('div');
            box.style.textAlign='center';
            const label=document.createElement('div');
            label.style.fontWeight='700';
            label.style.fontSize='13px';
            label.textContent=k;
            const sel=document.createElement('select');
            sel.className='input';
            sel.style.maxWidth='140px';
            sel.style.marginTop='6px';
            p.options[k].forEach(v=>{
              const o=document.createElement('option');
              o.value=v;

      /* ======= Wishlist logic + animated subtotals ======= */
      function addToWishlist(productId, qty=1, options={}){
        const p=findProductById(productId);
        if(!p) return;
        const key=keyFor(p, options);
        const existing=WISHLIST.find(it=> it.key===key);
        if(existing){
          existing.qty += qty;
          existing.subtotal = existing.qty * existing.price;
        } else {
          WISHLIST.unshift({ key, id:p.id, title:p.title, price:p.price, qty, options, subtotal: qty*p.price });
        }
        persistAll();
        renderCartPreview();
        pushHistory(p);
        // record click when added as well
        animateTotalsPulse();
      }

      function removeFromWishlist(key){
        WISHLIST = WISHLIST.filter(it=>it.key!==key);
        persistAll();
        renderCartPreview();
      }

      function updateWishlistQty(key, deltaOrAbsolute, mode='delta'){
        const it=WISHLIST.find(i=>i.key===key);
        if(!it) return;
        if(mode==='delta') it.qty = Math.max(0, it.qty + Number(deltaOrAbsolute));
        else it.qty = Math.max(0, Number(deltaOrAbsolute));
        if(it.qty===0) removeFromWishlist(key);
        else {
          const old = it.subtotal;
          it.subtotal = it.qty * it.price;
          persistAll();
          renderCartPreview();
          animateItemSubtotalInPreview(key, old, it.subtotal);
        }
      }
