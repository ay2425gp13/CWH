<script>
// 导航栏功能脚本
document.addEventListener('DOMContentLoaded', function() {
  // 更新用户信息显示
  updateUserInfo();
  
  // 设置当前页面高亮
  setActiveNavItem();
  
  // 退出登录功能
  setupLogoutHandler();
});

// 更新用户信息显示
function updateUserInfo() {
  const userInfo = sessionStorage.getItem('user_info');
  const userIdElement = document.getElementById('userId');
  
  if (userInfo && userIdElement) {
    const user = JSON.parse(userInfo);
    userIdElement.textContent = user.id;
  } else if (userIdElement) {
    userIdElement.textContent = 'Please Login';
    userIdElement.style.cursor = 'pointer';
    userIdElement.onclick = function() {
      // 检查是否通过服务器访问
      if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
        window.location.href = '/login';
      } else {
        // 如果是直接打开文件，跳转到服务器地址
        window.location.href = 'login.html';
      }
    };
  }
}

// 设置当前页面导航高亮
function setActiveNavItem() {
  const currentPath = window.location.pathname;
  const navItems = document.querySelectorAll('.nav-item');
  
  navItems.forEach(item => {
    item.classList.remove('active');
    const href = item.getAttribute('href');
    
    // 检查是否匹配当前页面
    if (currentPath === href || 
        (currentPath.includes('platform-market') && href === '/platform-market.html')) {
      item.classList.add('active');
    }
  });
}

// 设置退出登录处理
function setupLogoutHandler() {
  const logoutBtn = document.querySelector('.logout-btn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', function(e) {
      e.preventDefault();
      if (confirm('Are you sure you want to logout?')) {
        sessionStorage.removeItem('user_info');
        window.location.href = '/login';
      }
    });
  }
}
</script>
