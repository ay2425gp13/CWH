<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试商品图片</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .test-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
            border: 2px solid #ddd;
        }
        .status {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .success { color: green; }
        .error { color: red; }
        .info {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>商品图片加载测试</h1>
        <p>如果下面的图片能正常显示且各不相同，说明图片URL可用。</p>
        <p>如果所有图片都显示同一张或无法显示，说明可能是网络问题或CDN无法访问。</p>
    </div>
    
    <div class="test-grid" id="testGrid"></div>
    
    <script>
        // 测试前8个商品的图片URL
        const testImages = [
            { id: 1, url: "https://cdn.pixabay.com/photo/2016/11/22/23/38/action-figure-1851273_640.jpg?pid=1", title: "商品1" },
            { id: 2, url: "https://cdn.pixabay.com/photo/2017/08/07/13/58/robot-2603009_640.jpg?pid=2", title: "商品2" },
            { id: 3, url: "https://cdn.pixabay.com/photo/2015/09/09/16/05/toy-932455_640.jpg?pid=3", title: "商品3" },
            { id: 4, url: "https://cdn.pixabay.com/photo/2018/02/21/17/46/toy-3165515_640.jpg?pid=4", title: "商品4" },
            { id: 5, url: "https://cdn.pixabay.com/photo/2017/12/10/16/15/toy-3010847_640.jpg?pid=5", title: "商品5" },
            { id: 6, url: "https://cdn.pixabay.com/photo/2016/11/29/09/15/toy-1869343_640.jpg?pid=6", title: "商品6" },
            { id: 7, url: "https://cdn.pixabay.com/photo/2017/11/14/13/06/toy-2948774_640.jpg?pid=7", title: "商品7" },
            { id: 8, url: "https://cdn.pixabay.com/photo/2018/01/15/22/22/toy-3081484_640.jpg?pid=8", title: "商品8" },
        ];
        
        const grid = document.getElementById('testGrid');
        
        testImages.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'test-card';
            
            const img = document.createElement('img');
            img.className = 'test-image';
            img.src = item.url;
            img.alt = item.title;
            
            const status = document.createElement('div');
            status.className = 'status';
            status.id = `status${item.id}`;
            status.textContent = '加载中...';
            
            img.onload = function() {
                status.textContent = '✓ 加载成功';
                status.className = 'status success';
            };
            
            img.onerror = function() {
                status.textContent = '✗ 加载失败';
                status.className = 'status error';
            };
            
            const title = document.createElement('div');
            title.textContent = item.title;
            title.style.fontWeight = 'bold';
            title.style.marginBottom = '5px';
            
            const url = document.createElement('div');
            url.textContent = item.url.substring(0, 50) + '...';
            url.style.fontSize = '10px';
            url.style.color = '#999';
            url.style.marginTop = '5px';
            
            card.appendChild(title);
            card.appendChild(img);
            card.appendChild(status);
            card.appendChild(url);
            grid.appendChild(card);
        });
    </script>
</body>
</html>
